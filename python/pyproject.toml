[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "learn-python-tui"
version = "0.1.0"
description = "Interactive terminal course for Python 3 (LEARN-Python), JSON chapters + python3."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "textual>=0.62.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
learn-python-tui = "learn_python_tui.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["learn_python_tui*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
